  /v1/reports/mindfulness:
    post:
      consumes:
        - application/json
      description: |-
        대화 로그를 받아 심리적 측면에서 분석합니다. 감정적 식사 신호, 힘들었던 일, 감정의 변화를 중심으로 작성됩니다.
        심리 진단은 수행하지 않으며, 위험 신호가 반복되면 전문가 상담을 부드럽게 권합니다.
      parameters:
        - description: 대화 로그
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.MindfulnessReportRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ReportResponse"
        "400":
          description: 요청 형식 오류
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
        "502":

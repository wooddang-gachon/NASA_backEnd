      summary: 마음챙김 리포트
      tags:
        - reports
  /v1/reports/retrospective:
    post:
      consumes:
        - application/json
      description: |-
        전체 대화 로그와 함께 식사/활동/수분 기록을 받아 웰니스 관점에서 네 가지 측면을 다각도로 분석합니다.
        각 측면을 개별적으로 보는 것이 아니라 **서로 어떻게 연결되는지**에 초점을 맞춥니다.
        입력이 가장 큰 엔드포인트이므로 응답 시간이 가장 깁니다. 서비스 서버에서는 비동기 처리를 권장합니다.
        대화 로그는 최근 400턴까지만 모델에 전달됩니다.
      parameters:
        - description: 전체 기록
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.RetrospectiveReportRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ReportResponse"
        "400":
          description: 요청 형식 오류
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
        "502":
          description: 모델 오류
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
        "504":
          description: 모델 응답 지연
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
      summary: 장기 회고 리포트
      tags:
        - reports
  /v1/vision/analyze-food:
    post:
      consumes:
        - application/json
      description: |-
        이미지를 받아 사진 속 음식을 모두 인식하고, 각 음식의 이름과 정규화된 바운딩 박스 좌표를 반환합니다.
        `imageUrl` 또는 `imageBase64` 중 하나는 반드시 필요하며, 둘 다 주어지면 `imageBase64`가 우선합니다.
        바운딩 박스는 이미지 크기와 무관한 0.0~1.0 정규화 좌표입니다.
        영양 정보는 이 엔드포인트에서 제공하지 않습니다. 반환된 음식명으로 `/v1/nutrition/lookup`을 호출하세요.
      parameters:
        - description: 분석할 이미지
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.VisionAnalyzeRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.VisionAnalyzeResponse"
        "400":
          description: 요청 형식 오류 또는 이미지 누락
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
        "413":
          description: 이미지 용량 초과
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
        "415":
          description: 지원하지 않는 이미지 형식
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
        "502":
          description: 이미지 다운로드 실패 또는 모델 오류
          schema:
            $ref: "#/definitions/github_com_yeongin-ji_tammy-ai-server_internal_dto.ErrorResponse"
      summary: 음식 이미지 분석 및 음식명/바운딩박스 추출
      tags:
        - vision
